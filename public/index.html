<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Italy – Card Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-screen" class="screen">
        <h1>🇮🇹 Italy</h1>
        <input type="text" id="player-name" placeholder="Your name" value="Player">
        <div>
            <button id="create-room">Create Room</button>
            <span>or</span>
            <input type="text" id="room-code" placeholder="Room code">
            <button id="join-room">Join</button>
        </div>
        <div>
            <label>Match points:
                <select id="target-score">
                    <option value="30">30</option>
                    <option value="50">50</option>
                </select>
            </label>
        </div>
    </div>

    <div id="game-screen" class="screen hidden">
        <div class="top-bar">
            <span>Room: <span id="display-room-code"></span></span>
            <span>Team A: <span id="score-a">0</span> | Team B: <span id="score-b">0</span></span>
            <span>Tricks: <span id="trick-counter">0</span>/13</span>
            <span>Trump: <span id="trump-status">❓</span></span>
            <button id="restart-game" style="display:none;">Restart</button>
        </div>

        <div class="table">
            <!-- Player positions: 0 bottom, 1 right, 2 top, 3 left -->
            <div class="player player-bottom" id="player-0">
                <div class="player-name"></div>
                <div class="hand" id="hand-0"></div>
                <div class="tricks">Tricks: 0</div>
            </div>
            <div class="player player-right" id="player-1">
                <div class="player-name"></div>
                <div class="hand" id="hand-1"></div>
                <div class="tricks">Tricks: 0</div>
            </div>
            <div class="player player-top" id="player-2">
                <div class="player-name"></div>
                <div class="hand" id="hand-2"></div>
                <div class="tricks">Tricks: 0</div>
            </div>
            <div class="player player-left" id="player-3">
                <div class="player-name"></div>
                <div class="hand" id="hand-3"></div>
                <div class="tricks">Tricks: 0</div>
            </div>

            <!-- Center area for current trick and power card -->
            <div class="center-area">
                <div class="trick-cards" id="trick-cards"></div>
                <div class="power-card" id="power-card"></div>
            </div>
        </div>

        <!-- Calling controls (shown when needed) -->
        <div id="calling-controls" class="controls hidden">
            <button class="call-btn" data-call="7">Call 7</button>
            <button class="call-btn" data-call="8">Call 8</button>
            <button class="call-btn" data-call="9">Call 9</button>
            <button class="call-btn" data-call="Nil">Nil</button>
        </div>
    </div>

    <audio id="sound-deal" src="assets/deal.mp3"></audio>
    <audio id="sound-play" src="assets/play.mp3"></audio>
    <audio id="sound-win" src="assets/win.mp3"></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
